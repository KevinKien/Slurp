name: Build Slurp
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: curl-cozy
        run: bun install --frozen-lockfile
      - name: Build native release
        run: node scripts/build.mjs
      - name: Package native release
        run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: slurp-${{ runner.os }}-${{ runner.arch }}
          path: dist/artifacts/*
          if-no-files-found: error
  macos-universal-cli:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: slurp-macOS-*
          path: dist/macos-native
          merge-multiple: true
      - name: Package universal macOS CLI
        shell: bash
        run: node scripts/package-macos-cli.mjs --intel dist/macos-native/*-macos-x64-cli.tar.gz --arm64 dist/macos-native/*-macos-arm64-cli.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: slurp-macOS-universal-cli
          path: dist/artifacts/*
          if-no-files-found: error
